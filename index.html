<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매일 일본어 회화</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2B4C7E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#F7F8F6;--card:#FFFFFF;--ink:#1E2430;--mute:#667080;--line:#DCE1E4;--ai:#2B4C7E;--ai-soft:#E4EBF5;--good:#3C7A4E;--bad:#A5473A;
font-family:"Noto Sans KR",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181F;--card:#1D232C;--ink:#E7EAF0;--mute:#9AA3B2;--line:#2E3642;--ai:#8FB0E3;--ai-soft:#243247;--good:#7CC08E;--bad:#E08A7C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:grid;gap:14px}
.jp{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0}
.stat{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ai);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.label{font-size:12px;letter-spacing:.06em;color:var(--mute)}
.big{font-size:26px;line-height:1.4;margin:4px 0 0}
.kana-line{font-size:16px;color:var(--mute)}
.ko-read{font-size:17px;color:var(--ai);font-weight:600}
.ko{font-size:16px;margin-top:6px}
.note{color:var(--mute);font-size:14px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.b.p{background:var(--ai);border-color:var(--ai);color:var(--bg)}
.b:disabled{opacity:.45;cursor:default}
.b:focus-visible,nav button:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-content:center;font-size:13px;background:var(--ai-soft);color:var(--ai);flex:none}
.step.done .n{background:var(--good);color:var(--bg)}
.step .t{flex:1}
.step small{display:block;color:var(--mute);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai)}
.flash{text-align:center;min-height:190px;display:grid;place-content:center;gap:4px}
.flash .big{font-size:34px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices .b{padding:14px 8px;font-size:17px}
.choices .b.ok{border-color:var(--good);color:var(--good);font-weight:600}
.choices .b.ng{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse}
td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
td.w{font-size:18px;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ai-soft);color:var(--ai)}
.spk{border:1px solid var(--ai);background:var(--ai-soft);color:var(--ai);font:inherit;font-size:13px;font-weight:600;border-radius:99px;cursor:pointer;padding:4px 12px;white-space:nowrap;justify-self:center}
[data-say]{cursor:pointer}
input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 120px;width:100%}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.kgrid div{padding:5px 0;border:1px solid var(--line);border-radius:6px;font-size:19px;min-height:52px}
.kgrid div.empty{border-color:transparent}
.kgrid small{display:block;font-size:11px;color:var(--mute);line-height:1.3}
.explain{display:grid;gap:6px;font-size:14px;border-left:4px solid var(--line)}
.explain p{margin:0}
.explain.right{border-left-color:var(--good)}
.explain.wrong{border-left-color:var(--bad)}
.explain b{font-size:16px}
.marks{display:grid;gap:10px;font-size:14px}
.marks .mk{font-size:28px;color:var(--ai);margin-right:6px;vertical-align:middle}
.marks .ex{color:var(--mute);margin-top:2px}
.kanji{font-size:14px;margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.seg button{font:inherit;border:0;background:none;color:var(--mute);padding:8px 4px;border-radius:7px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--ai);color:var(--bg);font-weight:600}
.kgrid .h{border:0;font-size:12px;color:var(--mute);min-height:0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>매일 일본어 회화</h1><span class="stat" id="stat"></span></header>
  <main id="main"></main>
</div>
<nav>
  <button id="t-home" aria-selected="true">오늘 학습</button>
  <button id="t-review">복습</button>
  <button id="t-words">단어장</button>
  <button id="t-kana">가나 표</button>
  <button id="t-set">설정</button>
</nav>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / DAY);

// 상태: lesson 현재 과, steps 오늘 단계 완료 여부, cards 복습 카드, log 날짜별 학습 기록
const KEY = "nihongo-v2";
let S = { lesson: 0, stepsDay: -1, steps: {}, cards: {}, log: {}, wrong: {}, wrongDone: [] };
try { const v = localStorage.getItem(KEY); if (v) S = Object.assign(S, JSON.parse(v)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} stat(); }
function ensureDay() { if (S.stepsDay !== today()) { S.stepsDay = today(); S.steps = {}; save(); } }

// 발음 듣기
// 발음 재생. 안드로이드 Chrome은 정지 직후 재생을 무시할 때가 있어 정지가 필요할 때만 잠깐 쉬었다가 재생한다
let jaVoice = null;
function pickVoice() {
  // 일본어 음성 중 PC·폰에 설치된 음성을 먼저 쓰고, 없으면 온라인 음성을 쓴다
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang) || /japan|日本/i.test(v.name));
    jaVoice = vs.find(v => v.localService) || vs[0] || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
// Chrome은 재생 중인 발음 객체를 붙잡아 두지 않으면 재생이 끊기거나 멈춘 상태로 굳는 문제가 있다
let lastUtter = null;
function speak(text, rate, retried) {
  if (!("speechSynthesis" in window)) return;
  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = rate || 0.85;
    if (!jaVoice) pickVoice();
    if (jaVoice) u.voice = jaVoice;
    let started = false;
    u.onstart = () => { started = true; };
    lastUtter = u;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
    // 1.5초 안에 재생이 시작되지 않으면 멈춘 상태로 보고 한 번 풀고 다시 재생
    // Edge 온라인 음성은 시작 신호가 늦게 오므로 실제로 재생 중이 아닐 때만 다시 시도
    if (!retried) setTimeout(() => { if (!started && !speechSynthesis.speaking && lastUtter === u) { speechSynthesis.cancel(); setTimeout(() => speak(text, rate, true), 150); } }, 1500);
  };
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 150); }
    else go();
  } catch (e) {}
}
const spk = t => `<button class="spk" data-say="${esc(t)}" >▶ 발음</button>`;
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });

// 복습 카드
const GAP = [1, 2, 4, 7, 15, 30, 60];
function addCard(kind, jp, kana, ko, mean) {
  const k = kind + "|" + jp;
  if (!S.cards[k]) S.cards[k] = { kind, jp, kana, ko, mean, box: 0, due: today() + 1 };
}
const due = () => Object.keys(S.cards).filter(k => S.cards[k].due <= today());
function stat() {
  $("stat").textContent = `${S.lesson + 1}과 / ${LESSONS.length} · 단어 ${Object.keys(S.cards).length} · 복습 ${due().length}`;
}

// 읽기 표시: 가나(한국 발음)
function reading(kana, ko, jp) {
  return (kana && kana !== jp ? `<div class="kana-line jp">${esc(kana)}</div>` : "") + `<div class="ko-read">${esc(ko)}</div>`;
}

let tab = "home", sub = null;
function show(t) {
  tab = t; sub = null;
  ["home","review","words","kana","set"].forEach(x => $("t-" + x).setAttribute("aria-selected", x === t));
  render();
}
["home","review","words","kana","set"].forEach(x => $("t-" + x).onclick = () => show(x));

function render() {
  ensureDay();
  window.scrollTo(0, 0);
  if (tab === "home") sub ? sub() : home();
  else if (tab === "review") review();
  else if (tab === "words") sub ? sub() : words();
  else if (tab === "kana") kanaTable();
  else settings();
}

// ── 오늘 학습 ──
const STEPS = [
  ["kana", "가나 읽기 퀴즈", "20문제 · 약 5분"],
  ["expr", "새 표현 3개", "듣고 따라 말하기 · 약 10분"],
  ["word", "새 단어 10개", "보고 듣기, 뜻 맞히기 · 약 5분"],
  ["rev", "복습 카드", "오늘 돌아온 카드 전부 · 약 10분"]
];
const STEP_WRONG = ["wrong", "어제까지 틀린 문제", "맞히면 오답 노트에서 빠집니다"];
function steps() { return pendingWrong().length || S.steps.wrong ? [STEP_WRONG, ...STEPS] : STEPS; }
function home() {
  const L = LESSONS[S.lesson];
  const STEPS = steps();
  const doneN = STEPS.filter(s => S.steps[s[0]]).length;
  const all = doneN === STEPS.length;
  $("main").innerHTML = `
  <div class="card">
    <div class="label">${S.lesson + 1}과 · 오늘의 주제</div>
    <h2 style="font-size:22px;margin-top:2px">${esc(L.t)}</h2>
    <div class="bar" style="margin-top:10px"><i style="width:${doneN / STEPS.length * 100}%"></i></div>
    <div class="muted" style="margin-top:4px">${doneN} / ${STEPS.length} 단계 완료</div>
  </div>
  <div class="steps">${STEPS.map((s, i) => `
    <button class="step ${S.steps[s[0]] ? "done" : ""}" data-step="${s[0]}">
      <span class="n">${S.steps[s[0]] ? "✓" : i + 1}</span>
      <span class="t">${s[1]}<small>${s[2]}</small></span><span class="muted">›</span>
    </button>`).join("")}</div>
  ${all ? `<div class="card"><h2>오늘 학습을 마쳤습니다.</h2>
    <p class="muted">새 표현과 단어는 내일부터 복습 카드로 돌아옵니다.</p>
    ${S.lesson < LESSONS.length - 1 ? `<button class="b p" id="next">다음 과로 넘어가기</button>` : `<p>30과를 모두 마쳤습니다. 복습을 계속하세요.</p>`}</div>` : ""}`;
  document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    if (b.dataset.step === "wrong") { startWrong(pendingWrong(), "daily"); return; }
    sub = { kana: kanaQuiz, expr: exprStep, word: wordStep, rev: () => { tab = "review"; review(true); } }[b.dataset.step];
    render();
  });
  if ($("next")) $("next").onclick = () => { S.lesson++; S.steps = {}; save(); render(); };
}
function finish(step) {
  S.steps[step] = 1;
  S.log[today()] = (S.log[today()] || 0) + 1;
  if (step === "expr") LESSONS[S.lesson].e.forEach(e => addCard("표현", e[0], e[1], e[2], e[3]));
  if (step === "word") LESSONS[S.lesson].w.forEach(w => addCard("단어", w[0], w[1], w[2], w[3]));
  save(); sub = null; tab = "home"; show("home");
  if (ghGet("auto") && steps().every(s => S.steps[s[0]])) ghUpload();
}
const back = `<button class="b" id="back">← 오늘 학습</button>`;
function bindBack() { if ($("back")) $("back").onclick = () => show("home"); }

// 가나 퀴즈 해설: 행과 단, 탁점·반탁점, 가타카나 짝, 헷갈리는 글자, 특별한 읽기
const VOWEL = ["아", "이", "우", "에", "오"];
const DAKU_BASE = { 11: 1, 12: 2, 13: 3, 14: 5, 15: 5 }; // 탁음 행 → 원래 행
const LOOKALIKE = {
  "さ": "ち(치)와 좌우가 뒤집힌 모양입니다. き(키)와도 비슷하지만 き는 가로줄이 두 개입니다.",
  "ち": "さ(사)와 좌우가 뒤집힌 모양입니다.",
  "き": "さ(사)와 비슷하지만 가로줄이 두 개입니다.",
  "ぬ": "め(메)와 비슷하지만 ぬ는 끝에 작은 고리가 있습니다.",
  "め": "ぬ(누)와 비슷하지만 め는 끝에 고리가 없습니다.",
  "ね": "れ(레), わ(와)와 왼쪽이 같습니다. ね는 끝에 고리가 있습니다.",
  "れ": "ね(네), わ(와)와 왼쪽이 같습니다. れ는 끝이 바깥으로 뻗습니다.",
  "わ": "ね(네), れ(레)와 왼쪽이 같습니다. わ는 끝이 둥글게 닫힙니다.",
  "は": "ほ(호)와 비슷하지만 ほ는 오른쪽 위에 가로줄이 하나 더 있습니다.",
  "ほ": "は(하)와 비슷하지만 오른쪽 위에 가로줄이 하나 더 있습니다.",
  "る": "ろ(로)와 비슷하지만 る는 끝에 작은 고리가 있습니다.",
  "ろ": "る(루)와 비슷하지만 ろ는 끝에 고리가 없습니다.",
  "い": "り(리)와 비슷하지만 り는 오른쪽 획이 길게 내려옵니다.",

  "シ": "ツ(츠)와 헷갈리기 쉽습니다. シ는 점이 왼쪽에 세로로 놓이고 마지막 획이 아래에서 위로 올라갑니다.",
  "ツ": "シ(시)와 헷갈리기 쉽습니다. ツ는 점이 위쪽에 가로로 놓이고 마지막 획이 위에서 아래로 내려옵니다.",
  "ソ": "ン(응)과 헷갈리기 쉽습니다. ソ는 두 획이 모두 위에서 아래로 내려옵니다.",
  "ン": "ソ(소)와 헷갈리기 쉽습니다. ン은 두 번째 획이 아래에서 위로 올라갑니다.",
  "ク": "ケ(케), タ(타)와 비슷합니다. ク는 안쪽에 획이 없습니다.",
  "タ": "ク(쿠)와 비슷하지만 안쪽에 짧은 획이 하나 더 있습니다.",
  "ケ": "ク(쿠)와 비슷하지만 오른쪽 획이 위로 뻗지 않고 옆으로 뻗습니다.",
  "ウ": "ワ(와)와 비슷하지만 ウ는 위에 짧은 점이 하나 있습니다.",
  "ワ": "ウ(우)와 비슷하지만 위에 점이 없습니다.",
  "ノ": "비스듬한 획 하나로 된 글자입니다.",
  "メ": "ナ(나)와 비슷하지만 メ는 두 획이 X자로 엇갈립니다.",
  "ナ": "メ(메)와 비슷하지만 가로줄과 세로획이 十자에 가깝게 만납니다.",
  "ア": "マ(마)와 비슷하지만 ア는 가운데에서 아래로 긴 획이 내려옵니다.",
  "マ": "ア(아)와 비슷하지만 아래가 짧게 꺾여 끝납니다."
};
const SPECIAL = {
  "し": "로마자로는 shi로 적습니다. 한국어 '시'와 거의 같습니다.",
  "ち": "로마자로는 chi입니다. 한국어 '치'와 거의 같습니다.",
  "つ": "한국어에 없는 소리라 '츠'로 적지만, 실제로는 '쯔'와 '츠' 사이로 소리 납니다.",
  "ふ": "입술을 살짝 모아 바람을 내보내는 소리입니다. '후'와 '흐' 사이로 들립니다.",
  "は": "조사 '~은/는'으로 쓸 때는 '와'로 읽습니다. 예: こんにちは(콘니치와).",
  "へ": "조사 '~로(방향)'로 쓸 때는 '에'로 읽습니다.",
  "を": "お(오)와 소리가 같습니다. 조사 '~을/를'로만 씁니다.",
  "ん": "혼자서는 쓰지 않고 앞 글자의 받침처럼 붙습니다. 뒤 글자에 따라 ㄴ, ㅁ, ㅇ으로 들립니다.",
  "ぢ": "じ(지)와 소리가 같습니다. 거의 쓰지 않습니다.",
  "づ": "ず(즈)와 소리가 같습니다. 거의 쓰지 않습니다.",
  "じ": "ぢ도 같은 소리입니다. 보통은 じ를 씁니다.",
  "ず": "づ도 같은 소리입니다. 보통은 ず를 씁니다."
};
function kanaExplain(ch, ans, pick) {
  const isKata = /[ァ-ヶ]/.test(ch);
  const hira = isKata ? String.fromCharCode(ch.charCodeAt(0) - 0x60) : ch;
  let r = -1, c = -1;
  KANA.forEach((row, ri) => row.forEach((cell, ci) => { if (cell && cell[0] === hira) { r = ri; c = ci; } }));
  const conv = isKata ? toKata : (x => x);
  const lines = [];
  lines.push(`<b>${ch} = ${ans}</b>${pick === ans ? " · 정답입니다." : ` · 고른 답 '${esc(pick)}'는 틀렸습니다.`}`);
  if (r >= 11) {
    const baseCell = KANA[DAKU_BASE[r]][c], base = conv(baseCell[0]), bs = baseCell.slice(1);
    if (r === 15) lines.push(`${base}(${bs})의 오른쪽 위에 작은 동그라미 ゜(반탁점)를 붙인 글자입니다. 반탁점이 붙으면 ㅎ 소리가 ㅍ 소리로 바뀌어 '${ans}'가 됩니다.`);
    else lines.push(`${base}(${bs})의 오른쪽 위에 점 두 개 ゛(탁점)를 찍은 글자입니다. 탁점이 붙으면 소리가 탁해져 ${
      r === 11 ? "ㅋ이 ㄱ" : r === 12 ? "ㅅ이 ㅈ" : r === 13 ? "ㅌ이 ㄷ" : "ㅎ이 ㅂ"} 소리가 되므로 '${ans}'로 읽습니다.`);
  } else if (r >= 0) {
    const rowHead = conv(KANA[r][0][0]);
    if (r === 10) lines.push(`ん은 행에 속하지 않는 특별한 글자입니다.`);
    else if (hira === "を") lines.push(`わ행(와행)에 속하지만 '워'가 아니라 '오'로 읽습니다.`);
    else lines.push(`${rowHead}행(${KANA[r][0].slice(1)}행)의 '${VOWEL[c]}' 단 글자입니다. 그래서 ${KANA[r][0].slice(1)}행 자음에 '${VOWEL[c]}' 모음이 붙어 '${ans}'로 읽습니다.`);
  }
  if (isKata) lines.push(`가타카나 ${ch}의 히라가나 짝은 ${hira}입니다. 가타카나는 주로 외래어에 씁니다.`);
  if (SPECIAL[hira]) lines.push(SPECIAL[hira]);
  if (LOOKALIKE[ch]) lines.push("모양 주의: " + LOOKALIKE[ch]);
  if (pick !== ans) {
    const hits = [];
    KANA.forEach(row => row.forEach(cell => { if (cell && cell.slice(1) === pick) hits.push(conv(cell[0])); }));
    if (hits.length) lines.push(`'${esc(pick)}'로 읽는 글자는 ${hits.join(", ")}입니다.`);
  }
  return lines.map(l => `<p>${l}</p>`).join("");
}

// 3단계: 새 단어 (목록 → 뜻 맞히기)
let wq = null;
// 한자 표기가 가나와 다를 때만 작게 보여 줌
const kanjiNote = (jp, kana) => jp && jp !== kana ? `<div class="kanji muted jp">한자 ${esc(jp)}</div>` : "";
function wordStep() {

    if (type === "m2k") pool = shuffle(pool).sort((a, b) => Math.abs(a.length - ans.length) - Math.abs(b.length - ans.length)).slice(0, 12);

       ${wq.pick ? `<div class="jp" style="font-size:22px">${esc(w[1])}</div><div class="ko-read">${esc(w[2])}</div>${kanjiNote(w[0], w[1])}` : ""}`;

}

// ── 복습 ──
let rq = null, shown = false, fromStep = false, rqMissed = new Set();
function review(step) {

      ${fromStep ? `<button class="b p" id="fin">복습 단계 완료</button>` : ""}`;
    if ($("fin")) $("fin").onclick = () => { fromStep = false; finish("rev"); };
    return;
  }
  const c = S.cards[rq[0]];

  <div class="card flash">
    <div class="label">${c.kind} · 남은 카드 ${rq.length} · ${c.box}단계</div>
    ${reverse ? `<div class="big" style="font-size:24px">${esc(c.mean)}</div><div class="muted">일본어로 말해 보세요</div>` : `<div class="big jp" data-say="${esc(c.kana || c.jp)}">${esc(c.kana || c.jp)}</div>${spk(c.kana || c.jp)}`}
    ${shown ? `${reverse ? `<div class="big jp" style="font-size:24px">${esc(c.kana || c.jp)}</div>` : ""}<div class="ko-read">${esc(c.ko)}</div>${kanjiNote(c.jp, c.kana)}${reverse ? spk(c.kana || c.jp) : `<div class="ko">${esc(c.mean)}</div>`}` : ""}
  </div>
  <div class="row" style="justify-content:center">

  </div>`;
  if (!shown) $("sh").onclick = () => { shown = true; speak(c.kana); review(); };
  else {
    $("yes").onclick = () => grade(true);
    $("no").onclick = () => grade(false);
  }
}
function grade(ok) {
  const k = rq.shift(), c = S.cards[k];
  if (ok) { c.box = Math.min(c.box + 1, GAP.length - 1); c.due = today() + GAP[c.box]; }
  else {
    if (!rqMissed.has(k)) { rqMissed.add(k); addWrong("단어|" + (c.kana || c.jp), { kind: c.kind, q: c.kana || c.jp, a: c.mean, ko: c.ko, jp: c.jp }); }
    c.box = 0; c.due = today(); rq.push(k);
  }
  shown = false; save(); review();
}

// ── 오답 노트 ──
// S.wrong[key] = { kind, q(문제), a(정답), ko, jp, added(처음 틀린 날), misses(틀린 횟수) }
// 맞히면 S.wrongDone으로 옮기고, removed(빠진 날)로 남아 있던 날수를 계산
function addWrong(key, item) {
  if (!S.wrong) S.wrong = {};
  const w = S.wrong[key];
  if (w) { if (w.lastMiss !== today()) { w.misses++; w.lastMiss = today(); } }
  else S.wrong[key] = Object.assign(item, { added: today(), misses: 1, lastMiss: today() });
  save();
}
const pendingWrong = () => Object.keys(S.wrong || {}).filter(k => S.wrong[k].added < today());
const keptDays = w => (w.removed ?? today()) - w.added;
// 주 시작일(월요일)과 표시용 날짜
const weekStart = d => d - ((d + 3) % 7);
const dayLabel = d => { const t = new Date(d * DAY); return `${t.getUTCMonth() + 1}월 ${t.getUTCDate()}일`; };
const allWrong = () => [
  ...Object.entries(S.wrong || {}).map(([key, item]) => ({ key, item })),
  ...(S.wrongDone || []).map(d => ({ key: d.key, item: d }))
];

let wz = null;
// source: "daily"(오늘 학습) 또는 "week"(주별 복습)
function startWrong(keys, source, items) {
  const list = items || keys.map(k => ({ key: k, item: S.wrong[k] }));
  wz = { list: shuffle(list), i: 0, ok: 0, pick: null, opts: null, source };
  tab = source === "daily" ? "home" : "words";
  sub = wrongQuiz;
  render();
}
function wrongQuiz() {
  if (!wz || wz.i >= wz.list.length) {
    const r = wz; wz = null;
    $("main").innerHTML = `<div class="card flash"><div class="label">결과</div><div class="big">${r ? r.ok : 0} / ${r ? r.list.length : 0}</div>
      <div class="muted">맞힌 문제는 오답 노트에서 빠졌습니다. 틀린 문제는 내일 다시 나옵니다.</div></div>
      <div class="row"><button class="b p" id="fin">완료</button></div>`;
    $("fin").onclick = () => { if (r && r.source === "daily") finish("wrong"); else show("words"); };
    return;
  }
  const { key, item } = wz.list[wz.i];
  const isKana = item.kind === "가나";
  if (!wz.opts) {
    const pool = isKana
      ? KANA.flat().filter(Boolean).map(c => c.slice(1))
      : [...LESSONS.flatMap(l => l.w).map(x => x[3]), ...Object.values(S.cards).map(c => c.mean)];
    wz.opts = shuffle([item.a, ...shuffle(pool.filter((x, i, a) => x !== item.a && a.indexOf(x) === i)).slice(0, 3)]);
  }
  const days = keptDays(item);
  const bigStyle = isKana ? ' style="font-size:64px"' : "";
  $("main").innerHTML = `<button class="b" id="wback">← 돌아가기</button>
  <div class="card flash"><div class="label">${wz.i + 1} / ${wz.list.length} · ${esc(item.kind)} · ${days ? days + "일째 오답 노트" : "오늘 틀림"} · 틀린 횟수 ${item.misses}</div>
    <div class="big jp" data-say="${esc(item.q)}"${bigStyle}>${esc(item.q)}</div>
    ${wz.pick && !isKana ? `<div class="ko-read">${esc(item.ko)}</div>${kanjiNote(item.jp, item.q)}` : ""}${spk(item.q)}</div>
  <div class="choices">${wz.opts.map(o => `<button class="b ${wz.pick ? (o === item.a ? "ok" : o === wz.pick ? "ng" : "") : ""}" data-o="${esc(o)}" ${wz.pick ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
  ${wz.pick && isKana ? `<div class="card explain ${wz.pick === item.a ? "right" : "wrong"}">${kanaExplain(item.q, item.a, wz.pick)}</div>` : ""}
  ${wz.pick ? `<button class="b p" id="nx">다음</button>` : ""}`;
  $("wback").onclick = () => { wz = null; show(tab); };
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    wz.pick = b.dataset.o;
    speak(item.q);
    if (wz.pick === item.a) {
      wz.ok++;
      // 어제 이전에 들어온 오답이면 노트에서 빼고 기록으로 옮김
      if (S.wrong[key] && S.wrong[key].added < today()) {
        const done = Object.assign({}, S.wrong[key], { key, removed: today() });
        delete S.wrong[key];
        S.wrongDone = S.wrongDone || [];
        S.wrongDone.push(done);
      }
    } else addWrong(key, Object.assign({}, item, { removed: undefined }));
    save(); wrongQuiz();
  });
  if ($("nx")) $("nx").onclick = () => { wz.i++; wz.pick = null; wz.opts = null; wrongQuiz(); };
}
function wrongNote() {
  const active = Object.entries(S.wrong || {}).map(([key, item]) => ({ key, item }));
  const weeks = {};
  allWrong().forEach(x => { const w = weekStart(x.item.added); (weeks[w] = weeks[w] || []).push(x); });
  const wkeys = Object.keys(weeks).map(Number).sort((a, b) => b - a);
  const row = ({ item }) => `<tr>
      <td class="jp" style="font-size:18px">${esc(item.q)}${item.jp && item.jp !== item.q ? `<div class="muted" style="font-size:12px">${esc(item.jp)}</div>` : ""}</td>
      <td>${esc(item.a)}</td><td class="muted">${keptDays(item) ? keptDays(item) + "일째" : "오늘"} · ${item.misses}회</td><td>${spk(item.q)}</td></tr>`;
  return `
  <div class="card"><div class="label">오답 노트 · 남은 문제 ${active.length}개</div>
    <p class="muted" style="margin:4px 0">처음 풀 때 틀린 문제가 모입니다. 다음 날 오늘 학습에서 다시 나오고, 맞히면 빠집니다.</p>
    <table>${active.sort((a, b) => keptDays(b.item) - keptDays(a.item)).map(row).join("") || `<tr><td class="muted">틀린 문제가 없습니다.</td></tr>`}</table></div>
  <div class="card"><div class="label">주별 오답 복습</div>
    <p class="muted" style="margin:4px 0">그 주에 틀린 문제를 모두 다시 풉니다. 오래 남아 있던 문제부터 보여 줍니다.</p>
    <table>${wkeys.map(w => {
      const xs = weeks[w];
      const left = xs.filter(x => !x.item.removed).length;
      const avg = (xs.reduce((n, x) => n + keptDays(x.item), 0) / xs.length).toFixed(1);
      return `<tr><td>${dayLabel(w)} 주</td><td class="muted">${xs.length}문제 · 남음 ${left} · 평균 ${avg}일</td><td><button class="b" data-week="${w}">다시 풀기</button></td></tr>`;
    }).join("") || `<tr><td class="muted">아직 기록이 없습니다.</td></tr>`}</table></div>`;
}
function bindWrongNote() {
  document.querySelectorAll("[data-week]").forEach(b => b.onclick = () => {
    const w = +b.dataset.week;
    // 같은 문제가 여러 번 기록됐으면 한 번만 출제
    const seen = new Set();
    const items = allWrong().filter(x => weekStart(x.item.added) === w)
      .sort((a, c) => keptDays(c.item) - keptDays(a.item))
      .filter(x => !seen.has(x.key) && seen.add(x.key));
    startWrong(null, "week", items);
  });
}

      <input id="iw" class="jp" placeholder="단어 (日本)" required>
      <input id="ik" class="jp" placeholder="가나 (にほん)">
      <input id="ir" placeholder="한국 발음 (니혼)">
      <input id="im" placeholder="뜻 (일본)" required>
      <button class="b p">추가</button>
    </form></div>
  <div class="card"><div class="label">내 카드 ${list.length}개</div>
  <table>${list.map(([k, c]) => `<tr><td class="jp" style="font-size:16px">${esc(c.kana || c.jp)}${c.jp !== c.kana ? `<div class="muted" style="font-size:12px">${esc(c.jp)}</div>` : ""}<div class="ko-read" style="font-size:13px">${esc(c.ko)}</div></td><td>${esc(c.mean)}</td><td class="muted">${c.box}단계</td><td>${spk(c.kana || c.jp)}</td></tr>`).join("") || `<tr><td class="muted">아직 카드가 없습니다.</td></tr>`}</table></div>`;
  $("f").onsubmit = e => {
    e.preventDefault();
    addCard("내 단어", $("iw").value.trim(), $("ik").value.trim() || $("iw").value.trim(), $("ir").value.trim(), $("im").value.trim());
    save(); words();
  };
  bindWrongNote();
}

// ── 가나 표: 표준 오십음도 순서 (행 あかさたな…, 단 あいうえお) ──
function kanaTable() {
  const cols = [0, 1, 2, 3, 4];
  // 탁음 행 → 원래 행 (DAKU_BASE와 같은 대응, 표에서는 KANA.slice(11) 기준)
  const baseOf = (ri, ci) => KANA[DAKU_BASE[ri]][ci][0];
  const grid = (conv, rows, from, mark) => `<div class="kgrid">${cols.map(i => `<div class="h">${VOWEL[i]}</div>`).join("")}${
    rows.map((r, k) => cols.map(i => r[i]
      ? `<div class="jp" data-say="${r[i][0]}">${conv(r[i][0])}<small>${mark ? esc(conv(baseOf(from + k, i))) + (from + k === 15 ? "+゜" : "+゛") + " · " : ""}${r[i].slice(1)}</small></div>`
      : `<div class="empty"></div>`).join("")).join("")}</div>`;
  const MODES = {
    hira: ["히라가나", () => grid(x => x, KANA.slice(0, 11), 0)],
    kata: ["가타카나", () => grid(toKata, KANA.slice(0, 11), 0)],
    daku: ["탁음·반탁음", () => `
      <div class="marks">
        <div><span class="jp mk">゛</span><b>탁점</b> 점 두 개. 글자 오른쪽 위에 찍으면 소리가 탁해집니다.
          <div class="jp ex">か 카 → が 가 · さ 사 → ざ 자 · た 타 → だ 다 · は 하 → ば 바</div></div>
        <div><span class="jp mk">゜</span><b>반탁점</b> 작은 동그라미. は행에만 붙고, ㅎ 소리가 ㅍ 소리로 바뀝니다.
          <div class="jp ex">は 하 → ぱ 파 · ひ 히 → ぴ 피 · ふ 후 → ぷ 푸</div></div>
      </div>
      <div class="label" style="margin-top:12px">히라가나</div>${grid(x => x, KANA.slice(11), 11, true)}
      <div class="label" style="margin-top:12px">가타카나</div>${grid(toKata, KANA.slice(11), 11, true)}`]
  };
  let mode = "hira";
  try { mode = localStorage.getItem("kana-mode") || "hira"; } catch (e) {}
  if (!MODES[mode]) mode = "hira";
  $("main").innerHTML = `
  <div class="seg" role="tablist">${Object.entries(MODES).map(([k, m]) => `<button id="km-${k}" aria-selected="${k === mode}">${m[0]}</button>`).join("")}</div>
  <div class="card"><div class="label">${MODES[mode][0]} · 글자를 누르면 소리가 납니다</div><div style="margin-top:8px">${MODES[mode][1]()}</div></div>`;
  Object.keys(MODES).forEach(k => $("km-" + k).onclick = () => { try { localStorage.setItem("kana-mode", k); } catch (e) {} kanaTable(); });
}

// ── 설정: 백업 ──
function settings() {
  const days = Object.keys(S.log).length;
  $("main").innerHTML = `
  <div class="card"><div class="label">기록</div><p style="margin:4px 0">학습한 날 ${days}일 · 현재 ${S.lesson + 1}과</p>
    <label class="muted" for="jump">과 이동</label>
    <div class="row"><input id="jump" type="number" min="1" max="${LESSONS.length}" value="${S.lesson + 1}" style="max-width:100px"><button class="b" id="go">이동</button></div></div>
  <div class="card"><div class="label">발음 테스트</div>
    <p class="muted">소리가 나지 않을 때 눌러 보세요. 이 폰의 일본어 음성 상태를 보여 줍니다.</p>
    <button class="b p" id="tts">▶ こんにちは 재생</button>
    <p class="muted" id="tts-msg"></p></div>
  <div class="card"><div class="label">백업</div>
    <p class="muted">기록은 이 폰의 브라우저에 저장됩니다. 폰을 바꾸거나 앱 데이터를 지우기 전에 아래 글자를 복사해 두세요.</p>
    <textarea id="bk" rows="4">${esc(JSON.stringify(S))}</textarea>
    <div class="row" style="margin-top:8px"><button class="b" id="cp">복사</button><button class="b" id="rs">붙여 넣은 내용으로 복원</button></div>
    <p class="muted" id="msg"></p></div>
  <div class="card"><div class="label">GitHub에 기록 올리기</div>
    <p class="muted">학습 기록을 개인 저장소의 progress.json에 올립니다. 토큰은 이 폰에만 저장됩니다.</p>
    <label class="muted" for="gh-repo">저장소</label>
    <input id="gh-repo" value="${esc(ghGet("repo") || "hirotop00/nihongo-progress")}">
    <label class="muted" for="gh-token">토큰</label>
    <input id="gh-token" type="password" autocomplete="off" placeholder="github_pat_..." value="${esc(ghGet("token"))}">
    <label class="row" style="margin-top:8px"><input id="gh-auto" type="checkbox" style="flex:none;width:auto" ${ghGet("auto") ? "checked" : ""}> 오늘 학습을 마치면 자동으로 올리기</label>
    <div class="row" style="margin-top:8px"><button class="b p" id="gh-up">지금 올리기</button><button class="b" id="gh-down">GitHub에서 내려받기</button></div>
    <p class="muted" id="gh-msg">${esc(ghGet("last") ? "마지막으로 올린 때: " + ghGet("last") : "")}</p></div>`;
  const keep = () => { ghSet("repo", $("gh-repo").value.trim()); ghSet("token", $("gh-token").value.trim()); ghSet("auto", $("gh-auto").checked ? "1" : ""); };
  ["gh-repo","gh-token","gh-auto"].forEach(id => $(id).onchange = keep);
  $("gh-up").onclick = async () => { keep(); $("gh-msg").textContent = "올리는 중…"; $("gh-msg").textContent = await ghUpload(); };
  $("gh-down").onclick = async () => {
    keep(); $("gh-msg").textContent = "내려받는 중…";
    try { const f = await ghFile(); if (!f) { $("gh-msg").textContent = "저장소에 아직 기록이 없습니다."; return; }
      S = Object.assign({ log: {} }, JSON.parse(f.text)); save(); $("gh-msg").textContent = "내려받았습니다. 이 폰의 기록을 GitHub 기록으로 바꿨습니다.";
    } catch (e) { $("gh-msg").textContent = e.message; }
  };
  $("tts").onclick = () => {
    if (!("speechSynthesis" in window)) { $("tts-msg").textContent = "이 브라우저는 음성 재생을 지원하지 않습니다. Chrome으로 열어 주세요."; return; }
    pickVoice(); speak("こんにちは");
    const vs = speechSynthesis.getVoices();
    $("tts-msg").textContent = jaVoice
      ? `사용 중인 음성: ${jaVoice.name} (${jaVoice.localService ? "설치된 음성" : "온라인 음성"}). 일본어 음성 전체: ${vs.filter(v => /^ja/i.test(v.lang)).map(v => v.name).join(", ")}. 소리가 안 나면 폰 볼륨(미디어 볼륨)과 무음 모드를 확인하세요.`
      : `일본어 음성을 찾지 못했습니다 (전체 음성 ${vs.length}개). 폰 설정의 텍스트 음성 변환에서 Google 음성 서비스의 일본어 음성 데이터를 설치하세요.`;
  };
  $("go").onclick = () => { const n = +$("jump").value; if (n >= 1 && n <= LESSONS.length) { S.lesson = n - 1; S.steps = {}; save(); show("home"); } };
  $("cp").onclick = () => { navigator.clipboard?.writeText($("bk").value).then(() => $("msg").textContent = "복사했습니다.", () => { $("bk").select(); $("msg").textContent = "글자를 길게 눌러 복사하세요."; }); };
  $("rs").onclick = () => { try { S = Object.assign({ log: {} }, JSON.parse($("bk").value)); save(); $("msg").textContent = "복원했습니다."; } catch (e) { $("msg").textContent = "형식이 맞지 않습니다. 복사한 내용을 그대로 붙여 넣으세요."; } };
}

// ── GitHub 기록 저장 ──
function ghGet(k) { try { return localStorage.getItem("gh-" + k) || ""; } catch (e) { return ""; } }
function ghSet(k, v) { try { localStorage.setItem("gh-" + k, v); } catch (e) {} }
const b64 = s => { const u = new TextEncoder().encode(s); let t = ""; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
async function ghFetch(method, body) {
  const repo = ghGet("repo"), token = ghGet("token");
  if (!repo || !token) throw new Error("설정 탭에서 저장소와 토큰을 먼저 입력하세요.");
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/progress.json`, {
    method, cache: "no-store",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 404 && method === "GET") return null;
  if (r.status === 401) throw new Error("토큰이 맞지 않거나 만료됐습니다. 새 토큰을 넣으세요.");
  if (r.status === 403 || r.status === 404) throw new Error("이 저장소에 쓸 권한이 없습니다. 토큰의 저장소와 Contents 권한을 확인하세요.");
  if (!r.ok) throw new Error("GitHub 오류 " + r.status + ". 잠시 뒤 다시 시도하세요.");
  return r.json();
}
async function ghFile() { const j = await ghFetch("GET"); return j ? { sha: j.sha, text: unb64(j.content) } : null; }
async function ghUpload() {
  try {
    const old = await ghFile();
    const report = Object.assign({ updated: new Date().toISOString() }, S);
    await ghFetch("PUT", { message: `학습 기록 ${new Date().toLocaleDateString("ko-KR")} · ${S.lesson + 1}과`, content: b64(JSON.stringify(report, null, 1)), sha: old?.sha });
    const t = new Date().toLocaleString("ko-KR"); ghSet("last", t);
    return "올렸습니다. " + t;
  } catch (e) { return e.message; }
}

stat(); render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
